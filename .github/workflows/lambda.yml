name: Deploy Aws Lambda

on:
  push:
    branches:
      - main
    
      


jobs: 
    deploy_lambda: ## name of our j
        runs-on: ubuntu-latest ## sets or specifies the runner 
        steps:
          - uses: actions/checkout@v4

          - name: Set up Python ## sets up our pythin environment 
            uses: actions/setup-python@v4
            with:
                python-version: '3.12'

          - name: Install dependencies ## installs aany packages 
            run: |
              python -m pip install --upgrade pip
              pip install -r lambda/requirements.txt

          - name: Configure AWS Credentials ## sets up AWS credentials  
            uses: aws-actions/configure-aws-credentials@v2
            with: 
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: eu-west-2

          - name: Deploy Lambda Function.  ## zips lambda directory and updates lambda function
            run: |
              cd lambda
              zip -r function.zip .
              aws lambda update-function-code --function-name my-test-cicd-lambda --zip-file fileb://function.zip